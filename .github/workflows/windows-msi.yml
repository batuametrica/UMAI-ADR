name: Windows ADR Collector MSI

on:
  pull_request:
    paths:
      - "Sensor/**"
      - ".github/workflows/windows-msi.yml"
  workflow_dispatch:

jobs:
  clean-windows-acceptance:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.6"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install build dependencies
        run: |
          python -m pip install "uv==0.12.8"
          python -m uv sync --project .\Sensor --locked --extra dev --no-install-project
          dotnet tool install --global wix --version 5.0.2
      - name: Test collector
        working-directory: Sensor
        run: python -m uv run --no-sync python -m pytest -q
      - name: Build MSI
        working-directory: Sensor
        run: python -m uv run --no-sync pwsh -File .\packaging\windows\verify-reproducible.ps1 -Version 1.0.0
      - name: Silent install acceptance
        working-directory: Sensor
        run: |
          $msi = (Resolve-Path .\packaging\windows\dist\umai-adr-collector-1.0.0-x64.msi).Path
          $process = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "$env:RUNNER_TEMP\install.log") -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log"; throw "install failed: $($process.ExitCode)" }
          if (-not (Test-Path "$env:ProgramFiles\UMAI ADR Collector\umai-adr-collector.exe")) { throw 'collector executable missing' }
          $task = Get-ScheduledTask -TaskName 'UMAI ADR Collector'
          if ($task.Principal.UserId -notmatch 'SYSTEM') { throw "unexpected task principal: $($task.Principal.UserId)" }
          & "$env:ProgramFiles\UMAI ADR Collector\New-SupportBundle.ps1" -OutputPath "$env:RUNNER_TEMP\support.zip"
          if (-not (Test-Path "$env:RUNNER_TEMP\support.zip")) { throw 'support bundle missing' }
      - name: Silent uninstall acceptance
        if: always()
        working-directory: Sensor
        run: |
          $msi = (Resolve-Path .\packaging\windows\dist\umai-adr-collector-1.0.0-x64.msi).Path
          $process = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart', '/l*v', "$env:RUNNER_TEMP\uninstall.log") -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\uninstall.log"; throw "uninstall failed: $($process.ExitCode)" }
          if (Get-ScheduledTask -TaskName 'UMAI ADR Collector' -ErrorAction SilentlyContinue) { throw 'scheduled task survived uninstall' }
          if (-not (Test-Path "$env:ProgramData\UMAI\ADR Collector\state")) { throw 'upgrade/rollback state directory was removed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umai-adr-collector-windows-x64
          path: |
            Sensor/packaging/windows/dist/*.msi
            Sensor/packaging/windows/dist/reproducibility.json
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/support.zip
